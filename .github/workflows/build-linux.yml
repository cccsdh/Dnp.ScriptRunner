name: Linux Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish (linux-x64)
        run: dotnet publish ScriptRunner/Dnp.ScriptRunner.csproj --configuration Release -r linux-x64 --self-contained false -o ./artifacts/publish-linux-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: published-linux-x64
          path: ./artifacts/publish-linux-x64

      # The Windows and Linux workflows share one GitHub release per commit. Whichever
      # finishes first creates it; the other finds it by commit SHA and adds its asset.
      - name: Determine release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          releases="repos/$GITHUB_REPOSITORY/releases?per_page=100"
          existing=$(gh api "$releases" --jq "[.[] | select(.draft | not) | select(.target_commitish == \"$GITHUB_SHA\")][0].tag_name // empty")
          if [ -n "$existing" ]; then
            version="${existing#v}"
          else
            latest=$(gh api "$releases" --jq '[.[] | select((.draft or .prerelease) | not)] | sort_by(.created_at) | last | .tag_name // empty')
            if [ -z "$latest" ]; then
              version="1.0.00"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version=$(printf '%d.%d.%02d' "${major:-1}" "${minor:-0}" "$((10#${patch:-0} + 1))")
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # tar.gz keeps the executable bit, which a zip would lose.
      - name: Archive publish output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x ./artifacts/publish-linux-x64/Dnp.ScriptRunner
          tar -czf "./artifacts/ScriptRunner-linux-x64-$VERSION.tar.gz" -C ./artifacts/publish-linux-x64 .

      - name: Create or update GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          # Creation fails harmlessly if the Windows workflow created this release first.
          gh release create "$tag" --target "$GITHUB_SHA" --title "Release $VERSION" \
            --notes "Automated release created by CI for version $VERSION." \
            || gh release view "$tag" > /dev/null
          gh release upload "$tag" "./artifacts/ScriptRunner-linux-x64-$VERSION.tar.gz" --clobber

      - name: Prune old releases (keep last 5)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select((.draft or .prerelease) | not)] | sort_by(.created_at) | reverse | .[5:] | .[].tag_name' \
            | while read -r tag; do
                gh release delete "$tag" --cleanup-tag --yes || true
              done
