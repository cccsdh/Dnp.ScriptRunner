name: .NET Build and Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (8 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            
      - name: Print installed SDKs
        run: dotnet --list-sdks
        
      - name: Restore (force .NET 8 SDK)
        run: dotnet restore -p:TargetFramework=net8.0
        
      - name: Clear MSBuild SDK resolver cache
        run: |
          rmdir /s /q "%LOCALAPPDATA%\Microsoft\MSBuild\SdkResolverCache" 2>nul || exit 0
        shell: cmd

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # -----------------------------
      # Publish .NET 8
      # -----------------------------
      - name: Publish (.NET 8)
        run: dotnet publish --configuration Release -f net8.0 -r win-x64 --self-contained false -o ./artifacts/publish-net8

      # -----------------------------
      # Publish .NET 10
      # -----------------------------
      - name: Publish (.NET 10)
        run: dotnet publish --configuration Release -f net10.0 -r win-x64 --self-contained false -o ./artifacts/publish-net10

      # -----------------------------
      # Versioning
      # -----------------------------
      - name: Determine next version
        id: determine-version
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });

            const published = releases.data
              .filter(r => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let nextVersion = '1.0.00';
            if (published.length > 0) {
              const latestTag = published[0].tag_name.startsWith('v') ? published[0].tag_name.slice(1) : published[0].tag_name;
              const parts = latestTag.split('.');
              const major = parseInt(parts[0] || '1', 10);
              const minor = parseInt(parts[1] || '0', 10);
              const patch = parseInt(parts[2] || '0', 10) + 1;
              nextVersion = `${major}.${minor}.${String(patch).padStart(2, '0')}`;
            }

            fs.appendFileSync(process.env.GITHUB_ENV, `VERSION=${nextVersion}\n`);
            return nextVersion;

      # -----------------------------
      # Zip both artifacts
      # -----------------------------
      - name: Zip publish outputs
        id: zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $version = $env:VERSION

          $zip8 = "ScriptRunner-net8-$version.zip"
          $zip10 = "ScriptRunner-net10-$version.zip"

          Compress-Archive -Path ./artifacts/publish-net8/* -DestinationPath ./artifacts/$zip8
          Compress-Archive -Path ./artifacts/publish-net10/* -DestinationPath ./artifacts/$zip10

      # -----------------------------
      # Create GitHub Release
      # -----------------------------
      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          body: |
            Automated release created by CI for version ${{ env.VERSION }}.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Upload both artifacts
      # -----------------------------
      - name: Upload .NET 8 artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/ScriptRunner-net8-${{ env.VERSION }}.zip
          asset_name: ScriptRunner-net8-${{ env.VERSION }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .NET 10 artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/ScriptRunner-net10-${{ env.VERSION }}.zip
          asset_name: ScriptRunner-net10-${{ env.VERSION }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Prune old releases
      # -----------------------------
      - name: Prune old releases (keep last 5)
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const published = releases.data
              .filter(r => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const keep = 5;
            if (published.length <= keep) return;

            const toDelete = published.slice(keep);
            for (const rel of toDelete) {
              try { await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id }); } catch {}
              const tagRef = `tags/${rel.tag_name}`;
              try { await github.rest.git.deleteRef({ owner, repo, ref: tagRef }); } catch {}
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Upload artifacts to Actions
      # -----------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: published-exe
          path: ./artifacts/publish
